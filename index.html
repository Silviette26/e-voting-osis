<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>E-Voting OSIS</title>

  <!-- Library QR Scanner -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;
    }

    .card {
      background: white;
      width: 100%;
      max-width: 550px;

      padding: 30px;

      border-radius: 20px;

      text-align: center;

      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 8px;
    }

    .school {
      margin-top: 0;
      color: #555;
      margin-bottom: 25px;
    }

    #reader {
      width: 100%;
      max-width: 450px;
      margin: auto;
    }

    .instruction {
      margin-top: 20px;
      font-size: 16px;
      color: #555;
    }

    .result {
      margin-top: 20px;
      padding: 15px;

      background: #e8f5e9;
      color: #2e7d32;

      border-radius: 10px;

      display: none;
      word-break: break-word;
    }

    .error {
      margin-top: 20px;
      padding: 15px;

      background: #ffebee;
      color: #c62828;

      border-radius: 10px;

      display: none;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>🗳️ E-VOTING OSIS</h1>

    <p class="school">
      SMAN 7 Tanjungpinang
    </p>

    <h3>Silakan Scan QR Anda</h3>

    <!-- Tempat kamera -->
    <div id="reader"></div>

    <p class="instruction">
      Arahkan QR Code ke kamera
    </p>

    <!-- Hasil scan -->
    <div id="result" class="result">
      <strong>QR berhasil dibaca!</strong>
      <br><br>
      Token:
      <div id="token"></div>
    </div>

    <!-- Pesan error -->
    <div id="error" class="error"></div>

  </div>


  <script>

    function tampilkanHasil(token) {

      document.getElementById("result").style.display = "block";

      document.getElementById("token").textContent = token;

    }


    function tampilkanError(pesan) {

      const errorBox = document.getElementById("error");

      errorBox.textContent = pesan;

      errorBox.style.display = "block";

    }


    function onScanSuccess(decodedText, decodedResult) {

      console.log("QR berhasil dibaca:", decodedText);

      // Hentikan scanner setelah berhasil membaca
      html5QrcodeScanner.clear();

      // Tampilkan token
      tampilkanHasil(decodedText);

    }


    function onScanFailure(error) {

      // Jangan tampilkan error terus-menerus.
      // Scanner memang akan menghasilkan banyak percobaan gagal
      // sebelum QR berhasil terbaca.

    }


    // Membuat QR scanner
    const html5QrcodeScanner = new Html5QrcodeScanner(
      "reader",
      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        }
      },
      false
    );


    // Jalankan scanner
    html5QrcodeScanner.render(
      onScanSuccess,
      onScanFailure
    );

  </script>

</body>
</html>
